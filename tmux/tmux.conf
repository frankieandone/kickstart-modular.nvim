#NOTE: requires actual name of plugin - not path
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"

set -g @plugin 'tmux-plugins/tmux-resurrect' #restore
set -g @plugin 'tmux-plugins/tmux-continuum' #restore
set -g @plugin 'b0o/tmux-autoreload' #autoload the tmux configs using a bind key
set -g @plugin 'gcla/tmux-wormhole' #wormhole $filepath to send file from remote server to client
set -g @plugin 'tmux-plugins/tmux-yank' #clipboard (copy + paste)
set -g @plugin 'anghootys/tmux-ip-address' #show ip address in status bar

# Source .tmux.conf as suggested in `man tmux`
bind-key R source-file '~/.tmux.conf'

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# Set the default terminal mode to 256color mode
set -g default-terminal "xterm-256color"

# Enable RGB colour if running in xterm(1)
set -g terminal-overrides ",xterm*:Tc"

# Enable true color support
set -g terminal-features 'xterm-256color:RGB'

# Lower escape timing from 500ms to 50ms for quicker response to scroll-buffer access
set -g escape-time 50

# Enable focus events
set -g focus-events on

# Increase scrollback buffer size
set -g history-limit 50000

# Enable mouse support
set -g mouse on

# Start window numbering at 1
set -g base-index 1

# Start pane numbering at 1
set -g pane-base-index 1

# Rename window to reflect current program
set -g automatic-rename on

# Renumber windows when a window is closed
set -g renumber-windows on

# Set terminal title
set -g set-titles on

# Set clock mode to 12-hour format
set -g clock-mode-style 12

# Set vi mode for copy mode
set -g mode-keys vi

# Status bar configuration
set -g status-right '#{ip_address}'
set -g status-keys vi
set -g status-style bg=#f6511d,fg=#ffffff

# Window and pane management
bind-key & kill-window
bind-key x kill-pane
bind-key C-k clear-history

# Split windows with current path
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"

# Copy mode bindings
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'y' send-keys -X copy-selection

# Platform-specific settings
if-shell "uname | grep -q Darwin" {
    # macOS specific settings
    # Disable mission control keyboard shortcuts that interfere with tmux
    bind-key -n C-Up resize-pane -U 5
    bind-key -n C-Down resize-pane -D 5
    bind-key -n C-Left resize-pane -L 5
    bind-key -n C-Right resize-pane -R 5
} {
    # Linux specific settings
    bind-key -n C-Up resize-pane -U 5
    bind-key -n C-Down resize-pane -D 5
    bind-key -n C-Left resize-pane -L 5
    bind-key -n C-Right resize-pane -R 5
}

# Initialize TMUX plugin manager (keep this line at the very bottom of your tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
