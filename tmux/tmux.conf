#NOTE: requires actual name of plugin - not path
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"

set -g @plugin 'tmux-plugins/tmux-resurrect' #restore
set -g @plugin 'tmux-plugins/tmux-continuum' #restore
set -g @plugin 'b0o/tmux-autoreload' #autoload the tmux configs using a bind key
set -g @plugin 'gcla/tmux-wormhole' #wormhole $filepath to send file from remote server to client
set -g @plugin 'tmux-plugins/tmux-yank' #clipboard (copy + paste)
set -g @plugin 'anghootys/tmux-ip-address' #show ip address in status bar

# Source .tmux.conf as suggested in `man tmux`
bind-key R source-file '~/dotfilesx/tmux/tmux.conf'

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# Set the default terminal mode to 256color mode
set -g default-terminal ""

# Enable RGB colour if running in xterm(1)
set -g terminal-overrides ",xterm*:Tc"

set -g terminal-features 'xterm-256color:RBG'

set -g terminal-overrides 'xterm-256color:Tc'


set -g status-right '#{ip_address}'
set -g status-keys vi
set -g status-style bg=#f6511d,fg=#ffffff

# Lower escape timing from 500ms to 50ms for quicker response to scroll-buffer access
set -g escape-time 50

# Enable focus events
set -g focus-events on

# Increase scrollback buffer size
set -g history-limit 50000

# Enable mouse support
set -g mouse on

# Start window numbering at 1
set -g base-index 1

# Start pane numbering at 1
set -g pane-base-index 1

# Rename window to reflect current program
set -g automatic-rename on

# Renumber windows when a window is closed
set -g renumber-windows on

# Set terminal title
set -g set-titles on

set -g mouse on

set -g history-limit 1000000

set -g clock-mode-style 12
set -g focus-events on

set -g base-index 1
setw -g pane-base-index 1
setw -g automatic-rename off

set -g renumber-windows on

set -g mode-keys vi

bind-key & kill-window
bind-key x kill-pane
bind-key C-k clear-history

#NOTE: on macos: disable keyboard shortcuts:
#mission control and application window: ctrl+arrow_down[fn+j] and ctrl+arrow_up[fn+k]
#as resizing pane height depends on these keyboard shortcuts

#NOTE: keymaps
#ctrl+b = keymap prefix (leader key) for tmux

#ctrl+b then ctrl arrow_up[fn+k] = switch pane up
#ctrl+b then ctrl arrow_down[fn+j] = switch pane down
#ctrl+b then ctrl arrow_left[fn+h] = switch pane left
#ctrl+b then ctrl arrow_right[fn+l] = switch pane right

#ctrl+b then ctrl+arrow_up[fn+k] = increase pane height
#ctrl+b then ctrl+arrown_down[fn+j] = decrease pane height

#ctrl+b then x = close pane

#ctrl+b then o = next pane
#ctrl+b then q = show pane numbers
#ctrl+b then q [pane number from 0-9] = switch to pane number x from 0-9

#ctrl+b then ; = last active pane
#ctrl+b then % = split right
#ctrl+b then " = split down

bind-key -T copy-mode-vi 'v' send-keys -X being-selection
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"


#NOTE: requires path to tpm (executeable) file
run "~/dotfilesx/tmux/plugins/tpm"
