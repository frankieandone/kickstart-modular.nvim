import = [
    "~/dotfilesx/alacritty/noir.toml"
]

live_config_reload = true

[font]
size = 12.0
[font.normal]
family = "FiraCode Nerd Font"
[font.italic]
family = "FiraCode Nerd Font"
[font.bold]
family = "FiraCode Nerd Font"

[window]
decorations = "Full"
decorations_theme_variant = "Dark"
opacity = 1
[window.dimensions]
columns = 101
lines = 40

[colors.primary]
background = "#000000"
foreground = "#ffffff"

[colors.cursor]
text = "#080808"
cursor = "#ffffff"

[selection]
save_to_clipboard = true

[cursor]
blink_interval = 500
blink_timeout = 0
unfocused_hollow = true
thickness = 0.15
style = { shape = "Block", blinking = "On"}
vi_mode_style = { shape = "Block", blinking = "Always" }
[mouse]
hide_when_typing = true

[debug]
log_level = "Error"
persistent_logging = false
print_events = false
