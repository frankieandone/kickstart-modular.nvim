live_config_reload = true

[font]
size = 12.0
[font.normal]
family = "FiraCode Nerd Font"
[font.italic]
family = "FiraCode Nerd Font"
[font.bold]
family = "FiraCode Nerd Font"

[terminal.shell]
program = "/usr/bin/tmux"
args = ["new-session", "-A", "-D", "-s", "default"]

[window]
decorations = "Full"
decorations_theme_variant = "Dark"
opacity = 1
[window.dimensions]
columns = 101
lines = 40

[colors]
[colors.primary]
background = "0x0a0c10"
foreground = "0xf0f3f6"

[colors.cursor]
text = "0x0a0c10"
cursor = "0xf0f3f6"

[colors.normal]
black = "0x7a828e"
red = "0xff9492"
green = "0x26cd4d"
yellow = "0xf0b72f"
blue = "0x71b7ff"
magenta = "0xcb9eff"
cyan = "0x39c5cf"
white = "0xd9dee3"

[colors.bright]
black = "0x9ea7b3"
red = "0xffb1af"
green = "0x4ae168"
yellow = "0xf7c843"
blue = "0x91cbff"
magenta = "0xcb9eff"
cyan = "0x39c5cf"
white = "0xd9dee3"

[selection]
save_to_clipboard = true

[cursor]
blink_interval = 500
blink_timeout = 0
unfocused_hollow = true
thickness = 0.15
style = { shape = "Block", blinking = "On" }
vi_mode_style = { shape = "Block", blinking = "Always" }

[mouse]
hide_when_typing = true

[debug]
log_level = "Error"
persistent_logging = false
print_events = false

[keyboard]
bindings = [
  { key = "T", mods = "Control", chars = "\u0002c" },        #[tmux] new tab
  { key = "W", mods = "Control", chars = "\u0002x" },        #[tmux] close pane
  { key = "D", mods = "Control", chars = "\u0002%" },        #[tmux] split right
  { key = "D", mods = "Control|Shift", chars = "\u0002\"" }, #[tmux] split down
  { key = "H", mods = "Control", chars = "\u0002h" },
  { key = "J", mods = "Control", chars = "\u0002j" },
  { key = "K", mods = "Control", chars = "\u0002k" },
  { key = "L", mods = "Control", chars = "\u0002l" },
  { key = "Key1", mods = "Control", chars = "\u00021" },
  { key = "Key2", mods = "Control", chars = "\u00022" },
  { key = "Key3", mods = "Control", chars = "\u00023" },
  { key = "Key4", mods = "Control", chars = "\u00024" },
  { key = "Key5", mods = "Control", chars = "\u00025" },
  { key = "Key6", mods = "Control", chars = "\u00026" },
  { key = "Key7", mods = "Control", chars = "\u00027" },
  { key = "Key8", mods = "Control", chars = "\u00028" },
  { key = "Key9", mods = "Control", chars = "\u00029" },
  { key = "Left", mods = "Control", chars = "\u0002H" },
  { key = "Down", mods = "Control", chars = "\u0002J" },
  { key = "Up", mods = "Control", chars = "\u0002K" },
  { key = "Right", mods = "Control", chars = "\u0002L" },
]
